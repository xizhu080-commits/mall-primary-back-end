name: Java CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  # ============================================
  # 第一阶段：Java 构建
  # ============================================
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 构建
      - name: Build with Maven
        run: mvn clean package -DskipTests


  # ============================================
  # 第二阶段：构建并推送 Docker 镜像
  # ============================================
  docker:

    needs: build

    runs-on: ubuntu-latest

    # 只有 push 到 main/master 才推送 Docker 镜像
    if: github.event_name == 'push'

    steps:

      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 构建 Docker 镜像
      - name: Build Docker image
        run: |
          docker build \
            -t baizhou2026/mall-backend:latest \
            -t baizhou2026/mall-backend:${{ github.sha }} \
            .

      # 4. 推送 Docker 镜像
      - name: Push Docker image
        run: |
          docker push baizhou2026/mall-backend:latest
          docker push baizhou2026/mall-backend:${{ github.sha }}