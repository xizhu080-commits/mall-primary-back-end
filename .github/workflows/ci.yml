name: Java CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 GitHub 仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. 使用 Maven 构建项目
      - name: Build with Maven
        run: mvn clean package -DskipTests