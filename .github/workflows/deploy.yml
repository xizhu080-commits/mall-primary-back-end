name: Deploy to Aliyun Server

on:
  workflow_run:
    workflows: ["Java CI/CD"] # 这里必须填你之前 CI 工作流的 name 名字
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只有当 CI 流程成功跑完后，才执行这个部署任务
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # 1. 拉取你最新推送到 Docker Hub 的镜像
            docker pull baizhou2026/mall-backend:latest
            
            # 2. 停止并删除旧容器（如果存在）
            docker stop mall-backend || true
            docker rm mall-backend || true
            
            # 3. 启动新容器
            # --restart=always 表示如果服务器重启，容器也会自动启动
            # -p 8080:8080 表示将服务器的8080端口映射到容器的8080端口（请确认你的Java项目内部端口是8080）
            docker run -d --name mall-backend --restart=always -p 8080:8080 baizhou2026/mall-backend:latest
