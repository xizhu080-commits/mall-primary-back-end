global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"    # ✅ 新增

scrape_configs:

  - job_name: "mall-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "mall-backend:8080"

  - job_name: "linux"
    static_configs:
      - targets:
          - "node-exporter:9100"