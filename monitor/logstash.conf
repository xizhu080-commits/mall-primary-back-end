input {
  file {
    path => "/app/logs/*.json"
    start_position => "beginning"
    codec => json
    sincedb_path => "/usr/share/logstash/data/.sincedb"
  }
}
filter {
  # 如果日志里没有 timestamp 字段，用采集时间兜底
  if ![timestamp] {
    mutate { add_field => { "timestamp" => "%{@timestamp}" } }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "mall-backend-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }   # 调试用，稳定后可删
}