input {
  file {
    path => "/app/logs/*.json"
    start_position => "beginning"
    codec => json
    sincedb_path => "/dev/null"
  }
}

filter {
  if ![timestamp] {
    mutate { add_field => { "timestamp" => "%{@timestamp}" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "mall-backend-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}