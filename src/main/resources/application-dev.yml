# ============================================================
# 本地开发环境配置
# 数据库/Redis/RabbitMQ 通过 Docker 端口映射到 localhost
# ============================================================

spring:
  # --------------------------数据源配置--------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: mall
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --------------------------Redis 配置--------------------------
  data:
    redis:
      host: localhost
      port: 6379

  # --------------------------RabbitMQ 连接地址--------------------------
  rabbitmq:
    host: localhost
    port: 5672